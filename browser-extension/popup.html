<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dexo Integration</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="Dexo" class="logo">
        <div>
          <h1>Dexo</h1>
          <span class="subtitle">Integration Module</span>
        </div>
      </div>
      <div id="status-indicator" class="status-pill offline">
        <span class="dot"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </header>

    <!-- Quick Download Box -->
    <section class="section">
      <label for="url-input" class="label">Quick Download</label>
      <div class="input-group">
        <input type="text" id="url-input" placeholder="Paste link to download...">
        <button id="btn-download" class="btn-primary">Send</button>
      </div>
    </section>

    <!-- Settings Toggle -->
    <section class="section toggle-section">
      <div class="toggle-info">
        <span class="toggle-title">Catch Browser Downloads</span>
        <span class="toggle-desc">Automatically intercept matching file types</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-catch">
        <span class="slider"></span>
      </label>
    </section>

    <!-- Extension Filter -->
    <section class="section">
      <label for="ext-input" class="label">Monitored File Types</label>
      <input type="text" id="ext-input" class="mono-input" placeholder="zip, rar, 7z, iso, exe, mp4...">
      <p class="hint">Comma-separated file extensions to route to Downbyte</p>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span class="version">v1.0.0 (Manifest V3)</span>
      <button id="btn-save" class="btn-secondary">Save Settings</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
